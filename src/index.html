<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Ram Kumar Mishra — Full Stack Software Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Ram Kumar Mishra — Full Stack Software Engineer specializing in Angular, Node.js, MySQL, Docker and Playwright.">
  <meta name="theme-color" content="#0a0e14">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <script>
    // Apply the saved theme before first paint so dark-mode visitors never see a white flash.
    (function () {
      try {
        var t = localStorage.getItem('portfolio-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* storage unavailable — keep the dark default */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
