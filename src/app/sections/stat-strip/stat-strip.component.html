<section class="strip section--alt">
  <div class="container strip__grid">
    @for (s of stats; track s.label; let i = $index) {
      <div class="stat" [appReveal]="i * 70">
        <b class="stat__value">{{ s.value }}</b>
        <span class="stat__label">{{ s.label }}</span>
      </div>
    }
  </div>
</section>
